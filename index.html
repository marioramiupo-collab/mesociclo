function markDirty(kind){

  store.timers[kind]=setTimeout(()=>flush(kind),350);

function flushAll(){Object.keys(store.dirty).forEach(k=>{if(store.timers[k]){clearTimeout(store.timers[k]);flush(k)}})}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushAll()});
window.addEventListener('pagehide',flushAll);
function flush(kind){
  store.timers[kind]=null;
  if(store.mode==='local'){saveLocal();delete store.dirty[kind];return}
  if(store.mode!=='cloud')return;
  store.queue=store.queue.then(async()=>{
    try{
      if(kind==='cfg')await store.appRef.set({cfg:clone(state.cfg),updated:Date.now()});
      else await store.weeksRef.doc(kind).set(clone(state.weeks[kind]));
    }catch(e){setSv('err');toast('No se pudo guardar. Reintentando…');store.timers[kind]=setTimeout(()=>flush(kind),4000);return}
    if(!store.timers[kind])delete store.dirty[kind];
    if(!Object.keys(store.dirty).length)setSv('saved');
  });
}

        else{state.cfg=defaultCfg();markDirty('cfg');boot()}

/* ============================ cálculo de volumen ============================ */
function emptyAgg(){
  const g={};GROUPS.forEach(k=>g[k]={sets:0,reps:0,ton:0,st:0});
  return {groups:g,sets:0,reps:0,ton:0,st:0,rpeW:0,rpeN:0,rirW:0,rirN:0,dist:0,time:0,days:0,loose:0,runD:0,runT:0,runDT:0,runTT:0};
}
function rowStats(r,onlyDone){
  const e=exOf(r.ex);if(!e)return null;
  const str=e.kind!=='dist';
  const o={g:e.group,sets:0,reps:0,ton:0,st:0,rpeW:0,rpeN:0,rirW:0,rirN:0,dist:0,time:0,runD:0,runT:0,runDT:0,runTT:0};
  r.s.forEach(t=>{
    if(onlyDone&&!t.done)return;
    if(!setValid(t,e))return;
    o.sets++;
    if(str){o.reps+=nz(t.reps);o.ton+=nz(t.kg)*nz(t.reps)}else{o.dist+=nz(t.dist);o.time+=nz(t.time);if(e.run){o.runD+=nz(t.dist);o.runT+=nz(t.time);if(nz(t.dist)>0&&nz(t.time)>0){o.runDT+=nz(t.dist);o.runTT+=nz(t.time)}}}
    if(has(t.rpe)){o.st+=pts(+t.rpe);o.rpeW+=+t.rpe;o.rpeN++}
    if(has(t.rir)){o.rirW+=+t.rir;o.rirN++}
  });
  return o.sets?o:null;
}
let memo={ver:-1,wk:{}};
function aggWeek(k){return aggW(k,state.cfg.mode==='done')}
function aggW(k,done){
  if(memo.ver!==state.ver){memo={ver:state.ver,wk:{}}}
  const mk=k+(done?'d':'p');
  if(memo.wk[mk])return memo.wk[mk];
  const a=emptyAgg(),w=getWeek(k);
  w.days.forEach(d=>{
    if(d.type==='Descanso')return;
    let any=false;
    dayRows(d).forEach(r=>{
      const x=rowStats(r,done);if(!x)return;
      any=true;a.sets+=x.sets;a.reps+=x.reps;a.ton+=x.ton;a.st+=x.st;a.dist+=x.dist;a.time+=x.time;
      a.rpeW+=x.rpeW;a.rpeN+=x.rpeN;a.rirW+=x.rirW;a.rirN+=x.rirN;a.runD+=x.runD;a.runT+=x.runT;a.runDT+=x.runDT;a.runTT+=x.runTT;
      const g=a.groups[x.g];
      if(g){g.sets+=x.sets;g.reps+=x.reps;g.ton+=x.ton;g.st+=x.st}else a.loose+=x.sets;
    });
    if(any)a.days++;
  });
  memo.wk[mk]=a;return a;
}
const rpeAvg=a=>a.rpeN?a.rpeW/a.rpeN:0;
const rirAvg=a=>a.rirN?a.rirW/a.rirN:0;
function avgAgg(list){
  const n=list.length||1,a=emptyAgg();
  list.forEach(x=>{['sets','reps','ton','st','dist','time','rpeW','rpeN','rirW','rirN','days'].forEach(k=>a[k]+=x[k]);
    GROUPS.forEach(g=>['sets','reps','ton','st'].forEach(m=>a.groups[g][m]+=x.groups[g][m]))});
  ['sets','reps','ton','st','dist','time','days'].forEach(k=>a[k]/=n);
  GROUPS.forEach(g=>['sets','reps','ton','st'].forEach(m=>a.groups[g][m]/=n));
  return a;
}
const mval=(a,g,m)=>g==='_t'?a[m]:a.groups[g][m];
function weeksWithData(){return Object.keys(state.weeks).filter(k=>aggWeek(k).sets>0).sort()}
function monthWeeks(m){ // lunes cuyo mes es m
  const out=[];let d=parse(m+'-01');
  while(d.getDay()!==1)d.setDate(d.getDate()+1);
  while(iso(d).slice(0,7)===m){out.push(iso(d));d.setDate(d.getDate()+7)}
  return out;
}
function monthAgg(m){const ks=monthWeeks(m).filter(k=>aggWeek(k).sets>0);return {n:ks.length,a:avgAgg(ks.map(aggWeek))}}
function history(exId){
  const out=[],e=exOf(exId);
  Object.keys(state.weeks).forEach(k=>state.weeks[k].days.forEach((d,i)=>{
    if(d.type==='Descanso'||!d.rows)return;
    d.rows.forEach(r=>{if(r.ex===exId&&r.s&&r.s.some(t=>setValid(t,e)))out.push({date:addDays(k,i),r:r})});
  }));
  return out.sort((a,b)=>a.date<b.date?1:-1);
}
function fmtSet(r,e){
  const dist=e&&e.kind==='dist';
  const out=[];
  r.s.filter(t=>setValid(t,e)).map(t=>{
    if(dist){const p=[];if(nz(t.dist)>0)p.push(f0(t.dist)+' m');if(nz(t.time)>0)p.push(fTime(t.time));if(e.load&&nz(t.kg)>0)p.push(f1(t.kg)+' kg');return p.join(' ')}
    return f1(nz(t.kg))+' kg × '+f0(nz(t.reps))+(has(t.rpe)?' @'+f1(t.rpe):'');
  }).forEach(x=>{const l=out[out.length-1];if(l&&l.x===x)l.n++;else out.push({x:x,n:1})});
  return out.map(o=>(o.n>1?o.n+' × ':'')+o.x).join(' · ');
}

/* ============================ mutaciones ============================ */
function mutDay(wk,di,fn){const w=ensureWeek(wk),d=w.days[di];if(!d.rows)d.rows=routineRows(d.type);fn(d,w);markDirty(wk)}
function setType(wk,di,type){
  const w=ensureWeek(wk),d=w.days[di];
  const data=d.rows&&d.rows.some(r=>!isBlank(r));
  if(!data){d.type=type;d.rows=null;markDirty(wk);render();return}
  openSheet({t:'confirm',title:'Cambiar a '+type,text:'Este día ya tiene datos. ¿Qué hago con ellos?',actions:[
    {l:'Cambiar y borrar datos',danger:1,fn:()=>{d.type=type;d.rows=null;markDirty(wk);closeSheet();render()}},
    {l:'Cambiar tipo y conservar mis filas',fn:()=>{d.type=type;markDirty(wk);closeSheet();render()}},
    {l:'Cancelar',alt:1,fn:closeSheet}]});
}
function syncDay(wk,di){
  let added=0;
  mutDay(wk,di,d=>{const have=new Set(d.rows.map(r=>r.ex));routineRows(d.type).forEach(r=>{if(!have.has(r.ex)){d.rows.push(r);added++}})});
  toast(added?('Añadidos '+added+' ejercicios de la rutina'):'Ya tiene todos los de la rutina');render();
}
function copyWeek(src,dst,pct){
  const s=getWeek(src),w={days:s.days.map(d=>({type:d.type,rows:d.type==='Descanso'?null:dayRows(d).map(r=>{
    const c=clone(r);
    c.s.forEach(t=>{t.done=false;if(pct&&has(t.kg)&&+t.kg>0)t.kg=Math.round(+t.kg*(1+pct/100)*2)/2});
    return c})}))};
  state.weeks[dst]=w;markDirty(dst);
}

function zoneOf(sets,lm){

  if(sets<lm[0])return {k:'Bajo MEV',c:'var(--z-low)'};
  if(sets<=lm[1])return {k:'MEV–MAV',c:'var(--z-mid)'};
  if(sets<=lm[2])return {k:'MAV–MRV',c:'var(--z-high)'};
  return {k:'Sobre MRV',c:'var(--z-over)'};
}
function zoneBars(a){

      +'<div class="track"><div class="band" style="left:'+p(lm[0])+';width:'+(((lm[1]-lm[0])/mx)*100).toFixed(2)+'%;background:var(--z-mid);opacity:.22"></div>'

function blockTargets(s){const a=[];for(let w=1;w<s.n;w++)a.push(addDays(s.k,7*w));return a}
function blockWeek(base,w,s,deload){

      for(let q=0;q<extra;q++){const l=clone(c.s[c.s.length-1]);l.done=false;c.s.push(l)}
      if(deload)c.s=c.s.slice(0,Math.max(1,Math.ceil(c.s.length*0.6)));

    return {type:d.type,rows:rows}})};

function niceMax(v){if(v<=0)return 4;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
const kfmt=v=>v>=1000?(v/1000).toLocaleString('es-ES',{maximumFractionDigits:v>=10000?0:1})+'k':String(Math.round(v*10)/10).replace('.',',');
function lineChart(labels,series){

  let mx=0;series.forEach(s=>s.v.forEach(x=>{if(x>mx)mx=x}));mx=niceMax(mx*1.05);
  const X=i=>n===1?L+(W-L-R)/2:L+i*(W-L-R)/(n-1),Y=v=>T+(1-v/mx)*(H-T-B);
  let g='';
  for(let i=0;i<=4;i++){const v=mx*i/4,y=Y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" style="fill:var(--muted)" font-family="Barlow,sans-serif">'+kfmt(v)+'</text>'}
  const step=Math.ceil(n/6);
  labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" style="fill:var(--muted)" font-family="Barlow,sans-serif">'+esc(l)+'</text>'});
  series.forEach(s=>{
    const pts=s.v.map((v,i)=>X(i)+','+Y(v)).join(' ');
    g+='<polyline points="'+pts+'" fill="none" style="stroke:'+s.c+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
    s.v.forEach((v,i)=>{const last=i===n-1;g+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="'+(last?4.2:2.4)+'" style="fill:'+(last?s.c:'var(--surface)')+';stroke:'+s.c+'" stroke-width="1.6"/>'});
  });

}
function strengthSection(){
  const by={};
  Object.keys(state.weeks).forEach(k=>state.weeks[k].days.forEach((d,i)=>{
    if(d.type==='Descanso'||!d.rows)return;
    d.rows.forEach(r=>{const e=exOf(r.ex);if(!e||e.kind==='dist')return;
      r.s.forEach(t=>{if(!(+t.kg>0)||!(+t.reps>=1&&+t.reps<=12))return;(by[e.id]=by[e.id]||[]).push({date:addDays(k,i),e1:+t.kg*(1+(+t.reps)/30)})})});
  }));
  const rows=Object.keys(by).map(id=>{const a=by[id].sort((x,y)=>x.date<y.date?-1:1);
    const first=a[0].e1,best=Math.max.apply(null,a.map(x=>x.e1));return {e:exOf(id),n:a.length,best:best,first:first}})
    .filter(x=>x.e&&x.n>=1).sort((a,b)=>b.n-a.n).slice(0,8);
  if(!rows.length)return '';
  return '<div class="sec">Fuerza · 1RM estimado</div><div class="card">'+rows.map(x=>'<div class="row2"><i class="dot" style="--c:'+gcol(x.e.group)+'"></i><div class="l"><b>'+esc(x.e.name)+'</b><span>'+x.n+' registros</span></div>'+(x.n>1?delta(x.best,x.first):'')+'<div class="r">'+f1(x.best)+' kg</div></div>').join('')+'</div><div class="note">Epley: kg × (1 + reps/30), solo series de 1 a 12 reps.</div>';
}
function hyroxSection(all){
  const dist={};let tot=0;
  Object.keys(state.weeks).forEach(k=>state.weeks[k].days.forEach(d=>{
    if(d.type==='Descanso'||!d.rows)return;
    d.rows.forEach(r=>{const e=exOf(r.ex);if(!e||e.kind!=='dist')return;
      r.s.forEach(t=>{if(!setValid(t,e))return;
        const x=dist[e.id]=dist[e.id]||{e:e,m:0,t:0,best:0};
        x.m+=nz(t.dist);x.t+=nz(t.time);tot+=nz(t.dist);
        if(nz(t.dist)>0&&nz(t.time)>0){const pace=nz(t.time)/nz(t.dist)*1000;if(!x.best||pace<x.best)x.best=pace}});
    });
  }));
  const rows=Object.keys(dist).map(k=>dist[k]).sort((a,b)=>b.m-a.m);
  if(!rows.length)return '';
  const wk=all.slice(-4).reverse().map(p=>'<div class="row2"><div class="l"><b>'+esc(p.label)+'</b><span>'+esc(p.sub)+'</span></div><div class="r">'+f1(p.a.dist/1000)+' km</div><div class="r" style="min-width:64px">'+(p.a.time?fTime(p.a.time):'–')+'</div></div>').join('');
  return '<div class="sec">Hyrox · distancia y ritmo</div><div class="card">'+wk+'</div><div class="card" style="margin-top:8px">'+rows.map(x=>'<div class="row2"><i class="dot" style="--c:'+gcol(x.e.group)+'"></i><div class="l"><b>'+esc(x.e.name)+'</b><span>'+f1(x.m/1000)+' km acumulados'+(x.t?' · '+fTime(x.t):'')+'</span></div><div class="r">'+(x.best?fTime(x.best)+'<span class="muted" style="font-size:12px"> /km</span>':'–')+'</div></div>').join('')+'</div><div class="note">Mejor ritmo = menor tiempo por kilómetro en una serie. Los periodos suman o promedian según la vista elegida.</div>';
}

/* ============================ vista: progresiones ============================ */
const fPace=v=>{const t=Math.round(v);return Math.floor(t/60)+':'+pad(t%60)};
function lineChart2(labels,series,o){
  const W=340,H=190,L=46,R=14,T=12,B=26,n=labels.length,lo=o.lo,hi=o.hi;
  const X=i=>n===1?L+(W-L-R)/2:L+i*(W-L-R)/(n-1),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g='';
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" style="fill:var(--muted)" font-family="Barlow,sans-serif">'+o.fmt(v)+'</text>'}
  const step=Math.ceil(n/6);
  labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" style="fill:var(--muted)" font-family="Barlow,sans-serif">'+esc(l)+'</text>'});
  let any=false;
  series.forEach(s=>{
    let seg=[];
    const flush=()=>{if(seg.length>1)g+='<polyline points="'+seg.join(' ')+'" fill="none" style="stroke:'+s.c+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';seg=[]};
    s.v.forEach((v,i)=>{if(v==null){flush();return}any=true;seg.push(X(i)+','+Y(v))});flush();
    s.v.forEach((v,i)=>{if(v==null)return;const last=i===n-1;g+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="'+(last?4.2:2.6)+'" style="fill:'+(last?s.c:'var(--surface)')+';stroke:'+s.c+'" stroke-width="1.6"/>'});
  });
  if(!any)g+='<text x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle" font-size="12" style="fill:var(--muted)" font-family="Barlow,sans-serif">Sin datos</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Gráfico')+'">'+g+'</svg>';
}
function scaleOf(arrs,pace){
  const v=[];arrs.forEach(s=>s.forEach(x=>x.v.forEach(y=>{if(y!=null)v.push(y)})));
  if(!v.length)return {lo:0,hi:4};
  if(pace){const mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),lo=Math.max(0,Math.floor(mn*0.9/10)*10),hi=Math.ceil(mx*1.1/10)*10;return {lo:lo,hi:hi>lo?hi:lo+60}}
  return {lo:0,hi:niceMax(Math.max.apply(null,v)*1.05/4)*4};
}
function progWeeks(){
  const ks=Object.keys(state.weeks).filter(k=>aggW(k,false).sets>0).sort();
  if(!ks.length)return [];
  const out=[];for(let k=ks[0];k<=ks[ks.length-1];k=addDays(k,7))out.push(k);
  return out.slice(-ui.prg.range);
}
function accordion(key,title,inner){
  const o=ui.prg.open[key];
  return '<div class="card acc"><button class="acch" data-act="pgtoggle" data-v="'+key+'" aria-expanded="'+(!!o)+'"><b>'+title+'</b>'+ic('dn')+'</button>'+(o?'<div class="accb">'+inner+'</div>':'')+'</div>';
}
function pctChip(c,p){
  if(!(p>0))return '<span class="delta">—</span>';
  const v=c/p*100;return '<span class="delta '+(v>=95?'up':v<70?'dn':'')+'">'+Math.round(v)+' %</span>';
}
function cumplRow(label,p,c,fmt,nochip){
  return '<div class="row2"><div class="l"><b>'+esc(label)+'</b><span>Programado '+fmt(p)+' · Completado '+fmt(c)+'</span></div>'+(nochip?'':pctChip(c,p))+'</div>';
}

  const labels=wks.map(k=>fShort(k));
  const rangeChips='<div class="chips" style="margin-bottom:12px"><span class="muted" style="font-size:12px;align-self:center">Mostrar</span>'+[6,12,26,99].map(r=>'<button class="chip" data-act="pgrange" data-v="'+r+'" aria-pressed="'+(G.range===r)+'">'+(r===99?'Todo':r+' sem.')+'</button>').join('')+'</div>';

  const rmet={dist:['Distancia',a=>a.runD>0?a.runD/1000:0,v=>f1(v)+' km',v=>f1(v)],time:['Tiempo',a=>a.runT/60,v=>f0(v)+' min',v=>f0(v)],pace:['Ritmo',a=>a.runDT>0?a.runTT/a.runDT*1000:null,v=>v==null?'—':fPace(v)+' /km',fPace]}[G.rm];
  const runP=wks.map(k=>rmet[1](aggW(k,false))),runC=wks.map(k=>rmet[1](aggW(k,true)));

    +'<div class="note">Cuentan los ejercicios marcados como «carrera» (por defecto, Carrera 1 km). Se marcan en Biblioteca → editar ejercicio. El ritmo usa solo series con distancia y tiempo.</div>';
  /* volumen */
  const vm={ton:['Tonelaje',f0,'kg'],reps:['Reps',f0,''],sets:['Series',f0,'']};const vk=G.vm,vf=vm[vk][1];
  const vis=GROUPS.filter(g=>!G.hidden[g]);
  const mk=done=>vis.map(g=>({c:gcol(g),v:wks.map(k=>aggW(k,done).groups[g][vk])}));
  const sP=mk(false),sC=mk(true),sc2=scaleOf([sP,sC],false);
  const vc=(ser,lab)=>'<div class="card chart">'+lineChart2(labels,ser,{lo:sc2.lo,hi:sc2.hi,fmt:kfmt,label:lab})+'</div>';
  const totP=wks.map(k=>aggW(k,false)[vk]),totC=wks.map(k=>aggW(k,true)[vk]);
  const volInner='<div class="seg" role="group">'+Object.keys(vm).map(x=>'<button data-act="pgvm" data-v="'+x+'" aria-pressed="'+(vk===x)+'">'+vm[x][0]+'</button>').join('')+'</div>'
    +'<div class="gchips" style="padding:10px 0 0">'+GROUPS.map(g=>'<button class="chip" style="--c:'+gcol(g)+'" data-act="pghide" data-g="'+g+'" aria-pressed="'+(!G.hidden[g])+'"><i class="dot" style="--c:'+gcol(g)+'"></i>'+g+'</button>').join('')+'</div>'
    +'<div class="ctitle">Programado</div>'+vc(sP,'Volumen programado por grupo')
    +'<div class="ctitle">Ejecutado</div>'+vc(sC,'Volumen ejecutado por grupo')
    +'<div class="ctitle">Cumplimiento semanal · total</div><div class="card" style="box-shadow:none">'+wks.map((k,i)=>({k:k,i:i})).reverse().map(x=>cumplRow('Sem '+isoWeek(x.k)+' · '+labels[x.i],totP[x.i],totC[x.i],v=>vf(v)+(vm[vk][2]?' '+vm[vk][2]:''))).join('')+'</div>'
    +'<div class="note">Programado = todas las series con datos. Ejecutado = solo las series marcadas con ✓.</div>';
  return rangeChips+accordion('run','Progresión carrera',runInner)+accordion('vol','Volumen por grupo muscular',volInner);
}

function renderSheet(){
  const r=$('#sheetroot'),s=ui.sheet;
  document.body.classList.toggle('lock',!!s);
  if(!s){r.innerHTML='';return}
  let h='';
  const head=(t)=>'<h2><span>'+esc(t)+'</span><button class="ib" data-sa="close" aria-label="Cerrar">'+ic('x')+'</button></h2>';
  if(s.t==='type'){

  }else if(s.t==='dwtype'){

      +'<div class="chips" style="margin:10px 0"><button class="chip" data-sa="pall" aria-pressed="'+(!s.all)+'">Solo '+s.type+'</button><button class="chip" data-sa="pall" data-v="1" aria-pressed="'+(!!s.all)+'">Todos</button></div>'

function pickerList(s){
  const q=(s.q||'').toLowerCase();
  const inDay=new Set();
  if(s.mode==='day'){const d=getWeek(s.wk).days[s.di];dayRows(d).forEach(r=>inDay.add(r.ex))}
  else (state.cfg.routines[s.type]||[]).forEach(id=>inDay.add(id));
  const l=state.cfg.exercises.filter(e=>(s.all||showEx(e,s.type))&&(!q||e.name.toLowerCase().indexOf(q)>-1));
  if(!l.length)return '<div class="empty"><b>Sin resultados</b>Crea el ejercicio con «Crear nuevo».</div>';
  return l.map(e=>'<button class="opt" data-sa="pick" data-id="'+e.id+'"><i class="dot" style="--c:'+gcol(e.group)+'"></i><span style="flex:1;min-width:0;overflow-wrap:anywhere">'+esc(e.name)+'<small>'+e.group+'</small></span>'+(inDay.has(e.id)?'<span style="color:var(--hl)">'+ic('chk').replace('<svg','<svg width="18" height="18"')+'</span>':'')+'</button>').join('');
}
function addToCtx(s,id){
  if(s.mode==='day')mutDay(s.wk,s.di,d=>d.rows.push(blankRow(id)));
  else{const r=state.cfg.routines[s.type]=state.cfg.routines[s.type]||[];r.push(id);markDirty('cfg')}
}

/* ============================ eventos ============================ */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){setTab(tb.dataset.tab);return}
  const sa=e.target.closest('[data-sa]');
  if(sa&&ui.sheet){if(e.target.closest('.back')&&!e.target.closest('.sheet')||sa.dataset.sa!=='close'||true)sheetAct(sa,e);return}
  const a=e.target.closest('[data-act]');if(!a||!state.cfg)return;
  act(a);
});
function act(a){
  const d=a.dataset,wk=ui.wk;
  switch(d.act){
    case 'wprev':ui.wk=addDays(ui.wk,-7);render();break;
    case 'wnext':ui.wk=addDays(ui.wk,7);render();break;
    case 'today':ui.wk=mondayKey(new Date());ui.di=todayIdx();render();break;
    case 'day':ui.di=+d.i;render();break;
    case 'quicktype':setType(wk,ui.di,d.v);break;
    case 'typeSheet':openSheet({t:'type',wk:wk,di:ui.di});break;
    case 'daymenu':openSheet({t:'daymenu',wk:wk,di:ui.di});break;
    case 'addEx':openSheet({t:'picker',mode:'day',wk:wk,di:ui.di,type:getWeek(wk).days[ui.di].type});break;
    case 'rowmenu':openSheet({t:'rowmenu',wk:wk,di:ui.di,i:+d.i});break;
    case 'done':{const i=+d.i;mutDay(wk,ui.di,x=>{const r=x.rows[i],v=!r.s.every(t=>t.done);r.s.forEach(t=>t.done=v)});render();break}
    case 'sdone':{const i=+d.i,j=+d.j;let all;mutDay(wk,ui.di,x=>{const r=x.rows[i];r.s[j].done=!r.s[j].done;all=r.s.every(t=>t.done);
      a.setAttribute('aria-pressed',r.s[j].done);a.closest('.sr').classList.toggle('done',r.s[j].done)});
      const c=a.closest('.ex');c.classList.toggle('done',all);c.querySelector('.exh .chk').setAttribute('aria-pressed',all);refreshLive();break}
    case 'addset':{const i=+d.i;mutDay(wk,ui.di,x=>{const q=x.rows[i].s,l=q[q.length-1]||blankSet(),n=blankSet();n.kg=l.kg;n.reps=l.reps;n.dist=l.dist;n.time=l.time;q.push(n)});render();break}
    case 'setmenu':openSheet({t:'setmenu',wk:wk,di:ui.di,i:+d.i,j:+d.j});break;
    case 'mode':state.cfg.mode=d.m;markDirty('cfg');render();break;
    case 'mprev':case 'mnext':{const m=ui.month||ui.wk.slice(0,7),x=parse(m+'-01');x.setMonth(x.getMonth()+(d.act==='mnext'?1:-1));ui.month=iso(x).slice(0,7);render();break}
    case 'pmode':ui.plan.mode=d.v;ui.plan.src=null;render();break;
    case 'pbrush':ui.plan.brush=d.v;render();break;
    case 'cday':planTap(d.k,+d.i);break;
    case 'wmenu':openSheet({t:'wmenu',k:d.k});break;
    case 'newblock':{const m=ui.month||ui.wk.slice(0,7);const k=ui.wk.slice(0,7)===m?ui.wk:(monthWeeks(m)[0]||ui.wk);openSheet({t:'block',k:k,n:4,pct:2.5,ser:'w2',deload:1});break}
    case 'openwk':ui.wk=d.k;ui.di=Math.min(ui.di,6);ui.tab='semana';try{location.hash='semana'}catch(x){}render();window.scrollTo(0,0);break;
    case 'copy':openSheet({t:'copy',k:d.k,p:d.p,pct:0});break;
    case 'pgtoggle':ui.prg.open[d.v]=!ui.prg.open[d.v];render();break;
    case 'pgrm':ui.prg.rm=d.v;render();break;
    case 'pgvm':ui.prg.vm=d.v;render();break;
    case 'pgrange':ui.prg.range=+d.v;render();break;
    case 'pghide':ui.prg.hidden[d.g]=!ui.prg.hidden[d.g];render();break;
    case 'pview':ui.prog.view=d.v;render();break;
    case 'pmetric':ui.prog.metric=d.v;render();break;
    case 'prange':ui.prog.range=+d.v;render();break;
    case 'ghide':ui.prog.hidden[d.g]=!ui.prog.hidden[d.g];render();break;
    case 'extab':ui.exTab=d.v;render();break;
    case 'ftype':ui.fType=d.v;render();break;
    case 'newex':openSheet({t:'exedit',id:null,draft:{name:'',group:'Pectoral',kind:'fuerza',types:[]}});break;
    case 'editex':{const e=exOf(d.id);openSheet({t:'exedit',id:e.id,draft:clone(e)});break}
    case 'rmove':{const r=state.cfg.routines[d.t],i=+d.i,j=i+(+d.d);if(j<0||j>=r.length)break;const x=r[i];r[i]=r[j];r[j]=x;markDirty('cfg');render();break}
    case 'rdel':state.cfg.routines[d.t].splice(+d.i,1);markDirty('cfg');render();break;
    case 'radd':openSheet({t:'picker',mode:'rut',type:d.t});break;
    case 'dwset':openSheet({t:'dwtype',i:+d.i});break;
    case 'export':exportCsv();break;
    case 'exportjson':exportJson();break;
    case 'logout':fbLogout();break;
    case 'importjson':{const f=$('#imp');if(f)f.click();break}
  }
}
function sheetAct(el,ev){
  const s=ui.sheet,d=el.dataset;
  if(d.sa==='close'){if(el.classList.contains('back')&&ev.target!==el)return;closeSheet();return}
  switch(d.sa){
    case 'settype':closeSheet();setType(s.wk,s.di,d.v);break;
    case 'dwtype':state.cfg.defaultWeek[s.i]=d.v;markDirty('cfg');closeSheet();render();break;
    case 'act':s.actions[+d.i].fn();break;
    case 'sync':closeSheet();syncDay(s.wk,s.di);break;
    case 'resetday':{const w=ensureWeek(s.wk);w.days[s.di].rows=null;markDirty(s.wk);closeSheet();render();break}
    case 'doneall':mutDay(s.wk,s.di,x=>x.rows.forEach(r=>r.done=true));closeSheet();render();break;
    case 'hist':{const r=dayRows(getWeek(s.wk).days[s.di])[s.i];openSheet({t:'hist',id:r.ex});break}
    case 'rup':case 'rdn':{const k=d.sa==='rup'?-1:1;mutDay(s.wk,s.di,x=>{const j=s.i+k;if(j<0||j>=x.rows.length)return;const t=x.rows[s.i];x.rows[s.i]=x.rows[j];x.rows[j]=t});closeSheet();render();break}
    case 'wopen':ui.wk=s.k;ui.tab='semana';try{location.hash='semana'}catch(x){}closeSheet();render();window.scrollTo(0,0);break;
    case 'wcopy':openSheet({t:'copy',k:s.k,p:addDays(s.k,-7),pct:0});break;
    case 'wblock':openSheet({t:'block',k:s.k,n:4,pct:2.5,ser:'w2',deload:1});break;
    case 'wreset':{const k=s.k;openSheet({t:'confirm',title:'Restablecer semana',text:'Se borran los datos de esta semana y vuelve a la semana tipo.',actions:[{l:'Restablecer',danger:1,fn:()=>{state.weeks[k]=virtualWeek();markDirty(k);closeSheet();render()}},{l:'Cancelar',alt:1,fn:closeSheet}]});break}
    case 'bn':s.n=+d.v;renderSheet();break;
    case 'bp':s.pct=+d.v;renderSheet();break;
    case 'bs':s.ser=d.v;renderSheet();break;
    case 'bd':s.deload=+d.v;renderSheet();break;
    case 'bk':s.k=addDays(s.k,7*(+d.v));renderSheet();break;
    case 'bgo':createBlock(s);closeSheet();toast('Bloque creado');render();break;
    case 'sdup':mutDay(s.wk,s.di,x=>{const c=clone(x.rows[s.i].s[s.j]);c.done=false;x.rows[s.i].s.splice(s.j+1,0,c)});closeSheet();render();break;
    case 'sdel':mutDay(s.wk,s.di,x=>{const q=x.rows[s.i].s;q.splice(s.j,1);if(!q.length)q.push(blankSet())});closeSheet();render();break;
    case 'dup':mutDay(s.wk,s.di,x=>{const c=clone(x.rows[s.i]);c.done=false;x.rows.splice(s.i+1,0,c)});closeSheet();render();break;
    case 'rrm':mutDay(s.wk,s.di,x=>x.rows.splice(s.i,1));closeSheet();render();break;
    case 'cpp':s.pct=+d.v;renderSheet();break;
    case 'docopy':copyWeek(s.p,s.k,s.pct||0);closeSheet();toast('Semana copiada');render();break;
    case 'pall':s.all=!!d.v;renderSheet();break;
    case 'pick':addToCtx(s,d.id);toast('Añadido');$('#plist').innerHTML=pickerList(s);if(ui.tab==='semana'||ui.tab==='biblioteca')refreshUnderSheet();break;
    case 'newfrompick':openSheet({t:'exedit',id:null,back:s,draft:{name:'',group:'Pectoral',kind:'fuerza',types:s.type&&TRAIN.indexOf(s.type)>-1&&s.type!=='Full Body'?[s.type]:[]}});break;
    case 'ekind':s.draft.kind=d.v;if(d.v==='dist')s.draft.load=false;keepName(s);renderSheet();break;
    case 'erun':keepName(s);s.draft.run=d.v==='1';renderSheet();break;
    case 'eload':keepName(s);s.draft.load=d.v==='1';renderSheet();break;
    case 'etype':{keepName(s);const i=s.draft.types.indexOf(d.v);if(i>-1)s.draft.types.splice(i,1);else s.draft.types.push(d.v);renderSheet();break}
    case 'ebackcancel':openSheet(s.back);break;
    case 'esave':saveEx(s);break;
    case 'edel':if(!s.confirmDel){keepName(s);s.confirmDel=true;renderSheet()}else delEx(s);break;
  }
}
function keepName(s){const n=$('#en'),g=$('#eg');if(n)s.draft.name=n.value;if(g)s.draft.group=g.value}
function refreshUnderSheet(){ // actualiza lo que hay detrás de la hoja sin cerrarla
  const m=$('#main');const keep=window.scrollY;
  if(ui.tab==='semana'||ui.tab==='biblioteca'){render();window.scrollTo(0,keep)}
}
function saveEx(s){
  keepName(s);const dr=s.draft,name=(dr.name||'').trim();
  if(!name){toast('Escribe un nombre');return}
  if(state.cfg.exercises.some(e=>e.name.toLowerCase()===name.toLowerCase()&&e.id!==s.id)){toast('Ya existe un ejercicio con ese nombre');return}
  if(s.id){const e=exOf(s.id);e.name=name;e.group=dr.group;e.kind=dr.kind;e.load=dr.kind==='dist'?!!dr.load:true;e.run=dr.kind==='dist'?!!dr.run:false;e.types=dr.types.slice()}
  else{const id='e'+Date.now().toString(36);state.cfg.exercises.push({id:id,name:name,group:dr.group,kind:dr.kind,load:dr.kind==='dist'?!!dr.load:true,run:dr.kind==='dist'?!!dr.run:false,types:dr.types.slice()});
    if(s.back){const b=s.back;addToCtx(b,id);toast('Creado y añadido');markDirty('cfg');openSheet(b);render();return}}
  markDirty('cfg');closeSheet();render();toast('Guardado');
}
function delEx(s){
  const id=s.id;state.cfg.exercises=state.cfg.exercises.filter(e=>e.id!==id);
  Object.keys(state.cfg.routines).forEach(t=>state.cfg.routines[t]=state.cfg.routines[t].filter(x=>x!==id));
  markDirty('cfg');closeSheet();render();toast('Ejercicio eliminado');
}

/* campos numéricos */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('.sr input')){
    const f=t.dataset.f,i=+t.dataset.i,j=+t.dataset.j;if(f==='time')return;
    const raw=t.value.trim().replace(',','.');const v=raw===''?'':Number(raw);
    if(raw!==''&&!isFinite(v))return;
    mutDay(ui.wk,ui.di,d=>{d.rows[i].s[j][f]=v});refreshLive();
  }else if(t.id==='q'){ui.q=t.value;$('#exlist').innerHTML=exListHtml(state.cfg.exercises.filter(x=>(!ui.q||x.name.toLowerCase().indexOf(ui.q.toLowerCase())>-1)&&(ui.fType==='Todos'||ui.fType==='Full Body'||(x.types||[]).indexOf(ui.fType)>-1)))}
  else if(t.id==='pq'&&ui.sheet){ui.sheet.q=t.value;$('#plist').innerHTML=pickerList(ui.sheet)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='imp'){const f=t.files&&t.files[0];if(f){const r=new FileReader();r.onload=()=>importJsonText(String(r.result));r.readAsText(f)}t.value='';return}
  if(t.matches('.sr input')){
    const f=t.dataset.f,i=+t.dataset.i,j=+t.dataset.j;
    mutDay(ui.wk,ui.di,d=>{
      const q=d.rows[i].s[j];let v=q[f];
      if(f==='time'){v=pTime(t.value);q[f]=v;t.value=fTime(v)}
      else if(f==='rpe'&&has(v)){v=Math.min(10,Math.max(1,+v));q[f]=v;t.value=v}
      else if(f==='rir'&&has(v)){v=Math.min(10,Math.max(0,+v));q[f]=v;t.value=v}
    });refreshLive();
  }else if(t.dataset.lm){
    const v=state.cfg.landmarks[t.dataset.lm]||[8,14,20];v[+t.dataset.i]=Math.max(0,Math.round(+t.value||0));state.cfg.landmarks[t.dataset.lm]=v;markDirty('cfg');
  }else if(t.dataset.rts!==undefined){
    const r=state.cfg.rts[+t.dataset.rts];r[+t.dataset.j]=+t.value.replace(',','.')||0;markDirty('cfg');
  }
});

/* exportar */
async function exportCsv(){
  const rows=[['fecha','semana','dia','tipo','ejercicio','grupo','serie','kg','reps','rpe','rir','metros','tiempo_s','hecho','tonelaje_kg']];
  Object.keys(state.weeks).sort().forEach(k=>state.weeks[k].days.forEach((d,i)=>{
    if(d.type==='Descanso')return;
    dayRows(d).forEach(r=>{const e=exOf(r.ex);r.s.forEach((t,j)=>{if(!setValid(t,e))return;
      rows.push([addDays(k,i),isoWeek(k),DOWN[i],d.type,e?e.name:'',e?e.group:'',j+1,t.kg,t.reps,t.rpe,t.rir,t.dist,t.time,t.done?1:0,e&&e.kind!=='dist'?Math.round(nz(t.kg)*nz(t.reps)*10)/10:0])})});
  }));
  if(rows.length===1){toast('Aún no hay series que exportar');return}
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const r=await saveFile('mesociclo.csv',csv,'text/csv');
  if(r===true)toast('Exportado');else if(r===false)toast('No se pudo exportar');
}
async function saveFile(filename,data,mime){
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:filename,data:data});return true}
  }catch(e){if(e&&e.code==='declined')return null}
  try{
    const b=new Blob([data],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true;
  }catch(e){return false}
}
async function exportJson(){
  const r=await saveFile('mesociclo-copia-'+iso(new Date())+'.json',JSON.stringify({app:'mesociclo',v:1,cfg:state.cfg,weeks:state.weeks}),'application/json');
  if(r===true)toast('Copia guardada');else if(r===false)toast('No se pudo guardar la copia');
}
function importJsonText(txt){
  let d;try{d=JSON.parse(txt)}catch(e){}
  if(!d||d.app!=='mesociclo'||!d.cfg||!d.weeks||!Array.isArray(d.cfg.exercises)){toast('El archivo no es una copia de Mesociclo');return}
  const n=Object.keys(d.weeks).length;
  openSheet({t:'confirm',title:'Restaurar copia',text:'Se sustituyen el catálogo, las rutinas y los ajustes, y las '+n+' semanas de la copia. Las semanas que no estén en la copia se conservan.',actions:[
    {l:'Restaurar',danger:1,fn:()=>{
      state.cfg=d.cfg;migrate(state.cfg);markDirty('cfg');
      Object.keys(d.weeks).forEach(k=>{fixWeek(d.weeks[k]);state.weeks[k]=d.weeks[k];markDirty(k)});
      closeSheet();toast('Copia restaurada');render()}},
    {l:'Cancelar',alt:1,fn:closeSheet}]});
}

/* arranque */
function migrate(c){
  let ch=false;
  c.exercises.forEach(e=>{if(e.load===undefined){e.load=e.kind==='dist'?/sled|farmers|sandbag/i.test(e.name):true;ch=true}});
  c.exercises.forEach(e=>{if(e.run===undefined){e.run=e.kind==='dist'&&/carrera|running|correr/i.test(e.name);ch=true}});
  if(c.v<3){if(JSON.stringify(c.defaultWeek)===JSON.stringify(['Pierna','Brazo','Descanso','Torso','Full Body','Descanso','Descanso']))c.defaultWeek=['Descanso','Descanso','Descanso','Descanso','Descanso','Descanso','Descanso'];c.v=3;ch=true}
  return ch;
}
function boot(){
  Object.keys(state.weeks).forEach(k=>{if(fixWeek(state.weeks[k]))markDirty(k)});
  if(migrate(state.cfg))markDirty('cfg');
  const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))ui.tab=h;
  render();
}
initStore();
})();
